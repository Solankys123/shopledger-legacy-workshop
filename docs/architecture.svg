<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture</title>
  <desc id="description">The browser calls Express routers, which use library modules, configuration and a JSON store. The order flow shows how checkout calculates and saves totals and how invoices reuse checkout pricing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#42667a"/>
    </marker>
  </defs>
  <style>
    text { font: 16px system-ui, sans-serif; fill: #153144; }
    .title { font-size: 32px; font-weight: 700; }
    .heading { font-size: 19px; font-weight: 700; }
    .file { font: 15px monospace; }
    .panel { fill: #fff; stroke: #acbfca; }
    .route { fill: #e1f2ef; stroke: #79a79e; }
    .arrow { fill: none; stroke: #42667a; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="1120" height="740" fill="#f1f6f8"/>
  <text class="title" x="32" y="54">ShopLedger architecture</text>

  <rect class="panel" x="32" y="82" width="290" height="120" rx="12"/>
  <text class="heading" x="52" y="112">Browser UI</text>
  <text class="file" x="52" y="137">public/index.html</text>
  <text class="file" x="52" y="160">public/js/app.js</text>
  <text class="file" x="52" y="183">public/css/style.css</text>
  <path class="arrow" d="M 322 142 H 361" marker-start="url(#arrow)"/>
  <rect class="panel" x="362" y="103" width="240" height="78" rx="12"/>
  <text class="heading" x="382" y="133">server.js</text>
  <text x="382" y="158">Express · static UI · invoices</text>
  <path class="arrow" d="M 602 142 H 648"/>

  <rect class="route" x="650" y="82" width="438" height="120" rx="12"/>
  <text class="heading" x="670" y="112">Routers mounted at /api</text>
  <text class="file" x="670" y="147">routes/products.js</text>
  <text class="file" x="881" y="147">routes/orders.js</text>
  <text class="file" x="670" y="174">routes/customers.js</text>
  <text class="file" x="881" y="174">routes/reports.js</text>
  <path class="arrow" d="M 870 202 V 238"/>
  <path class="arrow" d="M 482 181 V 238"/>

  <rect class="panel" x="32" y="240" width="1056" height="142" rx="12"/>
  <text class="heading" x="52" y="269">lib/</text>
  <text class="file" x="52" y="305">orders.js</text>
  <text class="file" x="240" y="305">inventory.js</text>
  <text class="file" x="434" y="305">ledger.js</text>
  <text class="file" x="628" y="305">pricing.js</text>
  <text class="file" x="866" y="305">coupons.js</text>
  <text class="file" x="52" y="347">tax.js</text>
  <text class="file" x="240" y="347">dates.js</text>
  <text class="file" x="434" y="347">invoice.js</text>
  <text class="file" x="628" y="347">reports.js</text>
  <text class="file" x="866" y="347">store.js</text>

  <path class="arrow" d="M 167 414 V 383"/>
  <rect class="panel" x="32" y="414" width="270" height="50" rx="10"/>
  <text class="file" x="52" y="444">config.js</text>
  <path class="arrow" d="M 902 382 V 414" marker-start="url(#arrow)"/>
  <rect class="panel" x="832" y="414" width="256" height="50" rx="10"/>
  <text class="file" x="852" y="444">data/db.json</text>

  <rect class="route" x="32" y="495" width="1056" height="216" rx="12"/>
  <text class="heading" x="52" y="527">Placing an order</text>
  <text x="52" y="559">1. Browser submits POST /api/orders.</text>
  <text x="52" y="587">2. Read data/db.json, resolve catalog items, and check sellable stock.</text>
  <text x="52" y="615">3. Validate the coupon and calculate the discount, GST, and total in lib/pricing.js.</text>
  <text x="52" y="643">4. Charge Khata if selected, deduct stock, save the order and audit entry, and return HTTP 201.</text>
  <text x="52" y="681">The printable invoice uses the same pricing calculation on the saved order items and coupon.</text>
</svg>
